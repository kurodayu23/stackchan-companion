<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小栈设备屏 · 遥控反馈态模拟器</title>
<style>
  :root {
    --bg: #101216;
    --screen: #0a0b0e;
    --text: #f2f2f0;
    --dim: rgba(242,242,240,.55);
    --accent: #E3A857;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 100% at 50% 0%, #1b1e26 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 24px 12px 40px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .desc { font-size: 12px; color: var(--dim); margin: 0; text-align: center; max-width: 420px; line-height: 1.6; }
  .device-shell {
    width: 320px; height: 240px;
    border-radius: 14px;
    background: var(--screen);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.04);
    position: relative; overflow: hidden;
    touch-action: none;
  }
  .device-shell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .controls {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
    font-size: 12px; color: var(--dim);
  }
  .controls button {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  .controls button:active { background: rgba(255,255,255,.16); }
  .readout { font-variant-numeric: tabular-nums; color: var(--text); }
  /* 托盘（请无视，仅调试参考） */
  .dir-hint { font-size: 11px; color: var(--dim); opacity: .7; }
</style>
</head>
<body>
  <h1>设备屏 · 遥控反馈态</h1>
  <p class="desc">闪付给 320×240 屏幕的约定：被遥控时「眼睛看向左右、眉尖随俯仰、四个角显示角度」，空闲时回到深色 + 居中脸。用鼠标/手指在屏上拖动即可模拟被遥控。</p>
  <div class="device-shell" id="shell">
    <canvas id="screen"></canvas>
  </div>
  <div class="controls">
    <span>Yaw <b class="readout" id="yawOut">0°</b></span>
    <span>Pitch <b class="readout" id="pitchOut">6°</b></span>
    <button id="reset">回正</button>
    <button id="blinkEye" type="button">眯眼（思考态）</button>
  </div>
  <p class="dir-hint">拖动设备屏区域 ↔ 改变角度（Yaw 满程 −128°~128°，Pitch 3°~87°，阻尼同步到四个角的数字）</p>
  <p class="dir-hint">几何按固件真值渲染：眼容器 32×32、眼白直径 <code>map_range(size,-100,100,8,32)</code>、眼睑从上方压入（非同心理，偏移差 6 px）— 见 <code>docs/research/96</code> 与官方 <code>web/simulator/geometry.mjs</code>。</p>

<script>
(function () {
  const canvas = document.getElementById("screen");
  const shell = document.getElementById("shell");
  const yawOut = document.getElementById("yawOut");
  const pitchOut = document.getElementById("pitchOut");
  const ctx = canvas.getContext("2d");
  const W = 320, H = 240;
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.scale(DPR, DPR);

  let yaw = 0, pitch = 6, targetYaw = 0, targetPitch = 6;
  let dragging = false, lastX = 0, lastY = 0;

  // ⭐ 几何真值（出处：docs/research/96 §二 固件 eyes.cpp 实读 + 官方 web/simulator/geometry.mjs）
  //   F-1 眼容器恒为 32×32，锚点 = 眼白圆心
  //   F-2 眼白是圆、眼睑是正方形（边长 = 眼白直径），眼睑后建 ⇒ 压在眼白上
  //   F-3 眼睑 y 偏移 = -map_range(weight, 0, 100, 0, 眼睑高) ⇒ weight 越大越睁
  //   F-4 眼睑容器内绝对定位 ⇒ 与眼白圆心差 6 px（C−s)/2，所以 weight=0 露的是下缘月牙
  //   F-5 眼白直径 = map_range(size, -100, 100, 8, 32)；size=0 ⇒ 20 px
  const EYE_CONTAINER = 32;
  const EYE_DIAMETER = 20;            // size = 0
  const EYE_Y = 104, EYE_GAP = 62;
  const PUPIL_R = 7;
  const WEIGHT_OPEN = 70;             // 官方全睁档（Happy 72 / Angry 70 / Sad 70 / Neutral 0 取齐）
  const WEIGHT_SQUINT = 35;           // 官方眯眼档（Sleepy 35）
  let eyeWeight = WEIGHT_OPEN;

  // 96 号公式：露出的帽高 h(w) = 0.2·weight + 6（weight=70 ⇒ 20 全睁；35 ⇒ 13 露 65%）
  function lidCover(weight) {
    const visible = 0.2 * weight + 6;
    return Math.max(0, Math.min(EYE_DIAMETER, EYE_DIAMETER - visible));
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // 单只眼：眼白圆 + 眼睑正方形从容器顶压入（不同心，差 6 px）
  function drawEye(cx, cy, weight, pupilDx, pupilDy) {
    const r = EYE_DIAMETER / 2;
    ctx.fillStyle = "#f1f5f9";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

    // 眼睑：容器顶对齐（差 6 px 的绝对定位），从上方盖下来
    const cover = lidCover(weight);
    if (cover > 0) {
      ctx.fillStyle = "#0a0b0e";
      ctx.fillRect(cx - r, cy - r - 6 + 6, EYE_DIAMETER, cover); // 顶部与容器顶对齐
    }

    // 瞳孔（在眼白内随摇杆偏移）
    ctx.fillStyle = "#101216";
    ctx.beginPath();
    ctx.arc(cx + pupilDx, cy + pupilDy, PUPIL_R, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    // 应用阻尼
    yaw += (targetYaw - yaw) * 0.18;
    pitch += (targetPitch - pitch) * 0.18;
    yawOut.textContent = Math.round(yaw) + "°";
    pitchOut.textContent = Math.round(pitch) + "°";

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0a0b0e";
    ctx.fillRect(0, 0, W, H);

    // 遥控反馈：眼睛看向摇杆方向（瞳孔偏移），pitch 让眼皮微抬/微落
    const pupilDx = clamp(yaw, -128, 128) / 128 * 5;
    const pupilDy = clamp(pitch - 6, -20, 20) / 20 * 4;
    const eyeUp = -clamp(yaw, -8, 8) * 0.35;   // 左右眼竖直错位，跟随转头
    for (const side of [-1, 1]) {
      const cx = W / 2 + side * EYE_GAP;
      const cy = EYE_Y + eyeUp * side;
      drawEye(cx, cy, eyeWeight, pupilDx, pupilDy);
    }

    // 嘴：随 pitch 微开（固件：weight=0 ⇒ 宽 90 / 高 6 / 圆角 0）
    const mouthOpen = clamp(pitch, 3, 87) / 87 * 3;
    ctx.fillStyle = "#101216";
    ctx.beginPath();
    ctx.ellipse(W / 2, 152, 26, 4 + mouthOpen, 0, 0, Math.PI * 2);
    ctx.fill();

    // 四角读数（模拟设备屏的信息分区：左上 Yaw / 右上 档位 / 左下 Pitch / 右下 状态）
    ctx.fillStyle = "rgba(242,242,240,.5)";
    ctx.font = "10px monospace";
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.fillText(`Y ${Math.round(yaw)}°`, 10, 10);
    ctx.textAlign = "right";
    ctx.fillText(`P ${Math.round(pitch)}°`, W - 10, 10);
    ctx.textBaseline = "bottom";
    ctx.textAlign = "left";
    ctx.fillText("遥控中", 10, H - 8);
    ctx.textAlign = "right";
    ctx.fillText(`眼 ${eyeWeight}`, W - 10, H - 8);

    requestAnimationFrame(draw);
  }

  function pointerPos(e) {
    const rect = shell.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  shell.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    shell.setPointerCapture(e.pointerId);
  });
  shell.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    e.preventDefault();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    targetYaw = clamp(targetYaw + dx, -128, 128);
    targetPitch = clamp(targetPitch + dy * 0.5, 3, 87);
  });
  const endDrag = () => { dragging = false; };
  shell.addEventListener("pointerup", endDrag);
  shell.addEventListener("pointercancel", endDrag);
  document.getElementById("reset").addEventListener("click", () => { targetYaw = 0; targetPitch = 6; });
  document.getElementById("blinkEye").addEventListener("click", () => {
    // 思考态 ⇄ 全睁：走官方两档 weight（35 眯眼 / 70 全睁），见 docs/research/96 §三
    eyeWeight = eyeWeight === WEIGHT_SQUINT ? WEIGHT_OPEN : WEIGHT_SQUINT;
  });

  draw();
})();
</script>
</body>
</html>
